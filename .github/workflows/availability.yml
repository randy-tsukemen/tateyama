name: 立山 10月10日 空床監控
on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a clearly labeled failure to test email notifications"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lodging-availability
  cancel-in-progress: false
jobs:
  notification-test:
    if: ${{ inputs.test_notification }}
    name: 通知測試（非空位通知）
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=通知測試（非空位通知）::這是 Email 通知測試，不代表有空位。"
          exit 1
  check:
    if: ${{ !inputs.test_notification }}
    name: 檢查空床（發現空位或監控異常時失敗）
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查 2026-10-10 空位
        run: python monitor.py --date 2026-10-10
