name: 立山 10月10-11日 空床監控
on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send Telegram test and clearly labeled failure for email testing"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lodging-availability
  cancel-in-progress: false
jobs:
  notification-test:
    if: ${{ inputs.test_notification }}
    name: 通知測試（非空位通知）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py --test
      - name: Intentional failure for email test
        if: always()
        run: |
          echo "::error title=通知測試（非空位通知）::這是 Email 通知測試，不代表有空位。"
          exit 1
  check:
    if: ${{ !inputs.test_notification }}
    name: 檢查空床（發現空位或監控異常時失敗）
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查 2026-10-10 與 2026-10-11 空位
        id: availability
        run: python monitor.py --date 2026-10-10 --date 2026-10-11
      - name: Send vacancy or error directly to Telegram
        if: ${{ always() && !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_OUTCOME: ${{ steps.availability.outcome }}
        run: python telegram_notify.py
